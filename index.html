<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iMoney</title>
  <meta name="description" content="iMoney — a minimal, social money tracker. Log spending by hand, split with friends, no bank linking. Reserve your @handle before launch.">
  <meta property="og:title" content="iMoney">
  <meta property="og:image" content="https://withimoney.com/assets/appicon.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png?v=2">
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon-256.png?v=2">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"MobileApplication","name":"iMoney",
   "alternateName":["iMoney 記帳","iMoney Money Tracker"],
   "operatingSystem":"iOS","applicationCategory":"FinanceApplication",
   "url":"https://withimoney.com","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},
   "description":"A minimal, social expense tracker for iOS. Manual logging, splitting with friends, budgets and monthly reports — with no bank account linking and no ads."}
  </script>
  <script>
    if (/^zh/i.test(navigator.language)) location.replace('/zh/' + location.search);
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    :root { --bone: #f4f1ea; --bone-dim: #a8a49c; }
    body { background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", system-ui, sans-serif; }
    .cosmos {
      position: relative; width: 100%; height: 100svh; overflow: hidden;
      /* Desktop keeps the original wide photograph; phones get the
         portrait planetfull below. */
      background: #000 url(/assets/planet.jpg) right center / cover no-repeat;
    }
    .cosmos-inner {
      /* Centred in the dark: the planet's lit limb starts ~55% across the
         photo, so the column sits at half of that — the middle of the
         blank space, not hugging the corner. */
      position: absolute; top: 50%; left: 27vw;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    /* Not a flicker — a breath. The mark fades from near-transparent to
       fully lit and back, slow and even; nothing snaps. */
    .cosmos-mark { width: clamp(56px, 7vw, 92px); opacity: .25;
                   animation: cosmos-breathe 5s ease-in-out infinite; }
    @keyframes cosmos-breathe { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .cosmos-cta {
      color: var(--bone); text-decoration: none;
      font-size: clamp(15px, 1.8vw, 20px); font-weight: 600; letter-spacing: -.2px;
      opacity: .85; transition: opacity .25s;
    }
    /* The key hangs OUTSIDE the centring math: the eye centres on the
       words and barely counts the faint circle, so the column centres the
       text under the mark exactly and the key rides to the right. */
    .cosmos-cta { position: relative; white-space: nowrap; }
    .cosmos-cta:hover { opacity: 1; }
    /* The caret lives only while typing; the enter key waits for the last
       character before it fades in. */
    /* The box holds the finished line's width from the first frame, so
       the column never reflows and the mark above stays nailed down. */
    .cta-text { display: inline-block; text-align: center; }
    .cosmos-cta.typing .cta-text::after { content: "|"; margin-left: 2px;
      color: var(--bone-dim); animation: cta-caret 1s steps(1) infinite; }
    @keyframes cta-caret { 50% { opacity: 0; } }
    .cosmos-cta .cta-enter { opacity: 0; transition: opacity .45s; }
    .cosmos-cta.typed .cta-enter { opacity: 1; }
    .cta-enter {
      position: absolute; left: calc(100% + 5px); top: 50%;
      transform: translateY(-50%);
      /* 1.18em IS the text's line box (measured 23.6px at 20px type), so
         the circle's top and bottom sit exactly on the glyph bounds. */
      width: 1.18em; height: 1.18em; border-radius: 50%;
      /* Apple's dark-surface button, nothing more: a quiet fill from the
         system's tertiary-fill ladder, no border, no gradient, no glass.
         Hover brightens one step, the press one more — the way every
         circular control on apple.com behaves. */
      border: 0;
      background: rgba(255,255,255,.14);
      display: flex; align-items: center; justify-content: center;
      transition: border-color .25s, background .25s, color .25s;
    }
    .cosmos-cta:hover .cta-enter { background: rgba(255,255,255,.22); }
    .cosmos-cta:active .cta-enter { background: rgba(255,255,255,.30); }
    .cta-enter svg { width: .52em; height: .52em; display: block; }
    @media (max-width: 700px) {
      .cosmos { background: #000 url(/assets/planetfull.jpg) center / cover no-repeat; }
      .cosmos-inner { left: 50%; transform: translate(-50%, -50%); }
    }
    /* On a phone the words are a title, not a button: only the enter key
       takes you in. The anchor goes inert and the key alone stays live —
       a tap on it still bubbles to the link. Slightly bigger, because it
       is now the whole door. */
    @media (hover: none) {
      .cosmos-cta { pointer-events: none; }
      /* Same 1.18em as desktop: aligned to the text is also the smaller
         circle asked for. */
      .cosmos-cta .cta-enter { pointer-events: auto; }
    }

    @media (prefers-reduced-motion: reduce) { .cosmos-mark { animation: none; } }
  </style>
</head>
<body>
  <section class="cosmos" aria-label="iMoney">
    <div class="cosmos-inner">
      <img class="cosmos-mark" src="/assets/logo-mark.png" alt="">
      <a class="cosmos-cta" href="/claim/"><span class="cta-text">Reserve @yourname</span><span class="cta-enter" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3v5a2 2 0 0 1-2 2H3.5"/><path d="M6 7 3 10l3 3"/></svg></span></a>
    </div>
  </section>

  <script>
    // Three acts: "Reserve @yourname" — "on @iMoney" — and the line the
    // page rests on, "See you inside." Full erase between acts (they share
    // no prefix), and the box is frozen at the widest act with the text
    // centred inside it, so the column never changes width and the mark
    // above cannot move: not per keystroke, not between acts.
    (() => {
      const cta = document.querySelector('.cosmos-cta');
      const el = cta && cta.querySelector('.cta-text');
      if (!el) return;
      const ACTS = ['Welcome to @iMoney', 'Reserve @yourname'];
      // The key parks 5px off the LAST GLYPH, not off the frozen box —
      // the box holds the widest act's width, and when the final line is
      // narrower than that (zh: the reserve act is longest), a box-edge
      // key floats 40px out in space.
      const done = () => {
        cta.classList.remove('typing');
        const range = document.createRange();
        range.selectNodeContents(el);
        const key = cta.querySelector('.cta-enter');
        if (key) key.style.left =
          (range.getBoundingClientRect().right - cta.getBoundingClientRect().left + 5) + 'px';
        cta.classList.add('typed');
      };
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        // The one static frame has to carry the message — the reserve
        // line, not the welcome or the sign-off.
        el.textContent = ACTS[1]; done(); return;
      }
      // Measure with the typing class ON, so the caret's width is inside
      // the frozen box — at the widest act the caret otherwise pokes past
      // minWidth and nudges the whole column (the mark moved 3px).
      cta.classList.add('typing');
      let wMax = 0;
      for (const a of ACTS) {
        el.textContent = a;
        wMax = Math.max(wMax, el.getBoundingClientRect().width);
      }
      el.style.minWidth = Math.ceil(wMax) + 'px';
      el.textContent = '';
      // The welcome is a hello, not the message — it lands a touch
      // quicker; the reserve line keeps the deliberate pace.
      const typeOut = (add, i, next, act) => {
        el.textContent = add.slice(0, ++i);
        const pace = act === 0 ? 68 + Math.random() * 50 : 95 + Math.random() * 70;
        if (i < add.length) setTimeout(() => typeOut(add, i, next, act), pace);
        else next();
      };
      const erase = (next) => {
        el.textContent = el.textContent.slice(0, -1);
        if (el.textContent) setTimeout(() => erase(next), 34);
        else next();
      };
      const act = (i) => typeOut(ACTS[i], 0, () => {
        if (i === ACTS.length - 1) return done();
        setTimeout(() => erase(() => setTimeout(() => act(i + 1), 420)), 1050);
      }, i);
      setTimeout(() => act(0), 500);
    })();
  </script>
</body>
</html>
