<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserve @yourname — iMoney</title>
  <meta name="description" content="Spending is the art of knowing yourself. Claim your name on iMoney before it launches.">
  <meta property="og:title" content="Reserve @yourname on iMoney">
  <meta property="og:description" content="Spending is the art of knowing yourself.">
  <meta property="og:image" content="https://withimoney.com/assets/appicon.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/card.css">
  <link rel="stylesheet" href="/assets/orb.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* One column, vertically centred between a pinned header and a pinned
       footer. The old version stacked fixed margins and sized the ball with
       `calc(100svh - 450px)`; on a short window that sum overflowed, the page
       scrolled, and the ball got sliced off the top. Nothing here is a
       subtraction — the hero takes a share of the height and the flexbox
       does the arithmetic. */
    body {
      margin: 0; min-height: 100svh; background: var(--ink); color: var(--bone);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 24px; text-align: center;
    }
    .wrap { width: 100%; max-width: 760px; min-height: 100svh;
            display: flex; flex-direction: column; }

    header { display: flex; align-self: flex-start; padding: 26px 0 0; flex: 0 0 auto; }
    #brand { display: flex; align-items: center; gap: 9px; background: none; border: 0;
             padding: 0; margin: 0; color: inherit; font: inherit; cursor: default; }
    #brand img { height: 26px; }
    #brand b { font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
    /* Nothing announces itself. The mark just becomes touchable, and the
       only tell is the cursor and a breath of light on hover. */
    #brand.live { cursor: pointer; transition: opacity .3s; }
    #brand.live:hover { opacity: .62; }

    /* One image, edge to edge, nothing else. */
    .still { position: fixed; inset: 0; z-index: 50; background: #0b0b0c;
             opacity: 0; visibility: hidden; cursor: zoom-out;
             transition: opacity .7s ease, visibility .7s; }
    .still.open { opacity: 1; visibility: visible; }
    .still img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* The hero owns the leftover height and centres in it. gap replaces the
       margins that used to stack up. */
    main { flex: 1 1 auto; min-height: 0; overflow: visible;
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: clamp(16px, 3vh, 38px);
           padding: clamp(16px, 3vh, 40px) 0; }

    /* Height, not width — see assets/orb.css. It asks for 34vh and gives
       ground first when the column is tight, so the pearl gets smaller
       rather than the page getting longer. */
    .orb-scene { height: min(34vh, 400px); max-width: 86vw; }

    h1 { font-size: clamp(30px, 5.2vw, 52px); font-weight: 700; letter-spacing: -1.5px;
         margin: 0; }
    .say h1 { margin: 0; }
    .slogan { color: var(--bone-dim); font-size: clamp(15px, 1.7vw, 19px);
              margin: 10px 0 0; }

    .row { display: flex; gap: 9px; max-width: 300px; width: 100%; margin: 0 auto; }
    /* A lit well rather than a dark box. The old field was the same value as
       the page, so it read as decoration — this one is glass over ink, with
       a brighter rim, so it's obvious it's the thing you fill in. */
    .field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px;
             background: rgba(244,241,234,.055);
             border: 1px solid rgba(244,241,234,.20); border-radius: 18px; padding: 0 22px;
             box-shadow: inset 0 1px 0 rgba(244,241,234,.06);
             transition: border-color .2s, background .2s; }
    .field:hover { background: rgba(244,241,234,.075); }
    .field:focus-within { border-color: var(--accent); background: rgba(244,241,234,.09); }
    .field span { color: var(--bone-dim); font-size: clamp(17px, 4.6vw, 23px); font-weight: 600; flex: 0 0 auto; }
    input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--bone);
            font-weight: 600; font-size: clamp(17px, 4.6vw, 23px); line-height: 1; font-family: inherit; padding: 19px 0; letter-spacing: -.3px; }
    /* The placeholder is the instruction — dim to the point of invisible
       was the reason the field didn't read as a field. */
    input::placeholder { color: var(--bone-faint); opacity: 1; }
    button { background: var(--bone); color: var(--ink); border: 0; border-radius: 18px;
             padding: 19px 20px; flex: 0 0 auto; font-weight: 600; font-size: clamp(17px, 4.6vw, 23px); line-height: 1; font-family: inherit; cursor: pointer;
             white-space: nowrap; letter-spacing: -.2px; }
    button:disabled { opacity: .4; cursor: default; }

    .status { font-size: 14px; color: var(--bone-faint); min-height: 20px; margin: 0; }
    .status.bad { color: var(--negative); }
    .status.good { color: var(--positive); }

    footer { flex: 0 0 auto; padding: 0 0 26px; font-size: 13px; color: var(--bone-faint); }
    .lang { margin-bottom: 12px; }
    footer a { color: var(--bone-faint); text-decoration: none; }
    footer a:hover { color: var(--bone-dim); }
    footer .sep { opacity: .4; margin: 0 8px; }
  </style>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/appicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
  <div class="wrap">
    <header>
      <button id="brand" type="button">
        <img src="/assets/logo-mark.png" alt="">
        <b>iMoney</b>
      </button>
    </header>

    <main>
      <!-- The card is the whole page. It carries the mark, and the handle
           appears on it live as you type — you watch your name land on the
           object before you commit to anything. -->
      <div class="orb-scene">
        <div class="orb-float">
          <div class="orb" id="orb">
            <div class="orb-face">
              <img class="orb-logo" src="/assets/logo-ink-star.png" alt="iMoney">
              <div class="orb-handle placeholder" id="card-handle">@yourname</div>
              <div class="orb-sub">August 2026</div>
            </div>
          </div>
        </div>
        <div class="orb-shadow"></div>
      </div>

      <div class="say">
        <h1 id="headline">Reserve <span id="head-handle">@yourname</span></h1>
        <p class="slogan">A money app that does NOT read your bank.</p>
      </div>

      <form class="row" id="form">
        <label class="field">
          <span>@</span>
          <input id="handle" placeholder="yourname" autocapitalize="none" autocorrect="off"
                 spellcheck="false" maxlength="20" aria-label="Your handle">
        </label>
        <button id="go" type="submit" disabled>Reserve</button>
      </form>
      <p class="status" id="status"></p>
    </main>

    <footer>
      <div class="lang"><a href="/zh/">繁體中文</a></div>
      <a href="/privacy/">Privacy</a><span class="sep">·</span>
      <a href="/support/">Support</a><span class="sep">·</span>
      <a href="mailto:upappco@gmail.com">Contact</a>
    </footer>
  </div>

  <script>
    const SB = 'https://cpsdkarncveeemrfmkll.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwc2RrYXJuY3ZlZWVtcmZta2xsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzQ3NzAsImV4cCI6MjA5NjE1MDc3MH0.zzHVArTaz2OdW1pYEzMIlrgcyuXWm4MNnR-bizyRhdY';

    const input = document.getElementById('handle');
    const card  = document.getElementById('card-handle');
    const go    = document.getElementById('go');
    const status = document.getElementById('status');
    const DEFAULT = '';

    const clean = v => v.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '');

    input.addEventListener('input', () => {
      const h = clean(input.value);
      if (h !== input.value.trim().toLowerCase().replace(/^@/, '')) input.value = h;
      const shown = '@' + (h || 'yourname');
      card.textContent = shown;
      card.classList.toggle('placeholder', !h);
      document.getElementById('head-handle').textContent = shown;
      go.disabled = h.length < 2;
      status.className = 'status';
      if (!h.length)         { status.textContent = DEFAULT; }
      else if (h.length < 2) { status.textContent = 'At least 2 characters.'; }
      else                   { check(h); }
    });

    let checkTimer, checking = '';
    function check(h) {
      clearTimeout(checkTimer);
      status.textContent = 'Checking…';
      checkTimer = setTimeout(async () => {
        checking = h;
        try {
          const res = await fetch(SB + '/rest/v1/rpc/is_handle_taken', {
            method: 'POST',
            headers: { apikey: KEY, Authorization: 'Bearer ' + KEY,
                       'Content-Type': 'application/json' },
            body: JSON.stringify({ target_handle: h })
          });
          const taken = await res.json();
          if (checking !== h || clean(input.value) !== h) return;   // stale
          status.className = 'status' + (taken ? ' bad' : ' good');
          status.textContent = (taken ? '@%s is taken. Try another?' : '@%s is free.').replace('%s', h);
          go.disabled = !!taken;
        } catch {
          // Never claim "taken" on a network blip — let them try to reserve
          // and be told by the server, which can't be wrong about it.
          if (checking !== h) return;
          status.className = 'status';
          status.textContent = DEFAULT;
          go.disabled = false;
        }
      }, 350);
    }

    // Auth lives on /reserve — one place, one set of redirect URLs. The
    // handle rides along so nobody has to type it twice.
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const h = clean(input.value);
      if (h.length < 2 || go.disabled) return;
      location.href = '/reserve/?h=' + encodeURIComponent(h);
    });
  </script>
  <script src="/assets/orb.js"></script>
  <script src="/assets/still.js"></script>
  <script>
    (() => {
      // The ghost types itself. An empty field says "type something"; a
      // field quietly writing @ev, @kai, @yuki says "type a NAME" — and
      // it's the one thing on a still page that rewards watching.
      const input = document.getElementById('handle');
      const NAMES = ['ev', 'kai', 'yuki', 'asu', 'yourname'];
      let n = 0, i = 0, erasing = false;
      (function tick() {
        if (input.value) { input.placeholder = 'yourname'; return setTimeout(tick, 1200); }
        const word = NAMES[n];
        i += erasing ? -1 : 1;
        input.placeholder = word.slice(0, i) + (i < word.length ? '\u2009' : '');
        let wait = erasing ? 45 : 95;
        if (!erasing && i === word.length) { erasing = true; wait = 1500; }
        else if (erasing && i === 0)       { erasing = false; n = (n + 1) % NAMES.length; wait = 260; }
        setTimeout(tick, wait);
      })();
    })();
  </script>
</body>
</html>
