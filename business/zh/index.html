<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企業合作 — iMoney</title>
  <meta name="description" content="告訴我們你的生意——iMoney 為小型團隊量身打造記帳系統。">
  <link rel="stylesheet" href="../../style.css?v=12">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png?v=2">
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon-256.png?v=2">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
  <style>
    /* The form speaks Apple: quiet labels above grouped rounded fields,
       choices as pills you tap rather than menus you open, one bone
       button at the end. */
    .biz { margin-top: 8px; }
    .biz label.q { display: block; font-size: 13px; font-weight: 600;
                   color: var(--bone-dim); margin: 26px 0 10px;
                   letter-spacing: .1px; }
    .biz input[type=text], .biz input[type=email], .biz textarea {
      width: 100%; background: rgba(244,241,234,.055); color: var(--bone);
      border: 1px solid rgba(244,241,234,.16); border-radius: 14px;
      padding: 14px 16px; font-size: 16px; font-family: inherit; outline: none;
      transition: border-color .2s, background .2s;
    }
    .biz input:focus, .biz textarea:focus { border-color: var(--accent);
                                            background: rgba(244,241,234,.09); }
    .biz textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid rgba(244,241,234,.18); background: none;
            color: var(--bone-dim); border-radius: 999px; padding: 9px 16px;
            font-size: 14px; font-family: inherit; cursor: pointer;
            transition: background .15s, color .15s, border-color .15s; }
    .chip[aria-pressed="true"] { background: var(--bone); color: #0b0b0c;
                                 border-color: var(--bone); font-weight: 600; }
    .biz .send { width: 100%; margin-top: 30px; background: var(--bone);
                 color: #0b0b0c; border: 0; border-radius: 14px; padding: 15px;
                 font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .biz .send:disabled { opacity: .4; }
    .other-input { margin-top: 10px; }
    .form-msg { min-height: 20px; font-size: 13.5px; margin-top: 12px; color: var(--bone-faint); }
    .form-msg.bad { color: #e64a3c; }
    .thanks { display: none; margin-top: 34px; }
    .thanks h2 { margin-top: 0; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 540px) { .two { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header class="site"><a href="/">iMoney</a><span>企業合作</span></header>
  <h1>企業合作</h1>
  <p class="lede">iMoney 也為企業量身打造金錢解決方案——讓我們多認識彼此一點？</p>

  <form class="biz" id="biz">
    <div class="two">
      <div>
        <label class="q" for="f-name">你的名字</label>
        <input type="text" id="f-name" maxlength="120" autocomplete="name" required>
      </div>
      <div>
        <label class="q" for="f-email">電子郵件</label>
        <input type="email" id="f-email" maxlength="200" autocomplete="email" required>
      </div>
    </div>

    <label class="q">你是誰？</label>
    <div class="chips" id="who" data-single>
      <button type="button" class="chip">小型企業主</button>
      <button type="button" class="chip">自由工作者</button>
      <button type="button" class="chip">新創團隊</button>
      <button type="button" class="chip">銀行／金融機構</button>
      <button type="button" class="chip" data-other>其他</button>
    </div>
    <input type="text" id="who-other" class="other-input" maxlength="80"
           placeholder="說說你是誰" hidden>

    <label class="q">你現在怎麼記帳？可複選。</label>
    <div class="chips" id="tracking">
      <button type="button" class="chip">紙本帳簿</button>
      <button type="button" class="chip">試算表</button>
      <button type="button" class="chip">POS／收銀系統</button>
      <button type="button" class="chip">其他 App</button>
      <button type="button" class="chip">大多靠記憶</button>
      <button type="button" class="chip">有點亂</button>
    </div>

    <label class="q">想讓 iMoney 為你管理哪些項目？可複選。</label>
    <div class="chips" id="needs">
      <button type="button" class="chip">收支記錄</button>
      <button type="button" class="chip">預算與報表</button>
      <button type="button" class="chip">團隊花費</button>
      <button type="button" class="chip">現金流總覽</button>
      <button type="button" class="chip" data-other>其他需求</button>
    </div>
    <input type="text" id="needs-other" class="other-input" maxlength="80"
           placeholder="說說還需要什麼" hidden>

    <label class="q" for="f-msg">聊聊你的生意，想問 iMoney 的儘管問。讓我們一起合作。</label>
    <textarea id="f-msg" maxlength="2000"></textarea>

    <button type="submit" class="send" id="send">保持聯絡</button>
    <p class="form-msg" id="form-msg"></p>
  </form>

  <div class="thanks" id="thanks">
    <h2>謝謝你。</h2>
    <p>已經收到了。每一封我們都會讀，很快會回信給你。</p>
  </div>

  <footer><a href="../../privacy/zh/">隱私權政策</a> · <a href="../../support/zh/">支援</a><br>Copyright © 2026 iMoney. 保留一切權利。</footer>
</main>
<script>
  (() => {
    const $ = id => document.getElementById(id);
    document.querySelectorAll('.chips').forEach(group => {
      group.addEventListener('click', e => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        const single = group.hasAttribute('data-single');
        if (single) group.querySelectorAll('.chip').forEach(c =>
          c.setAttribute('aria-pressed', c === chip && chip.getAttribute('aria-pressed') !== 'true' ? 'true' : 'false'));
        else chip.setAttribute('aria-pressed', chip.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
        // "Other" opens its own line — picked in, cleared out.
        const other = group.parentElement.querySelector('#' + group.id + '-other');
        if (other) {
          const on = group.querySelector('.chip[data-other][aria-pressed="true"]');
          other.hidden = !on;
          if (on) other.focus();
        }
      });
    });
    $('biz').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = $('form-msg');
      const picked = sel => [...document.querySelectorAll(sel + ' .chip[aria-pressed="true"]')].map(c => c.textContent);
      const otherText = id => { const el = $(id); return el && !el.hidden && el.value.trim(); };
      let who = picked('#who')[0] || null;
      const whoOther = otherText('who-other');
      if (whoOther) who = whoOther;
      const needs = picked('#needs');
      const needsOther = otherText('needs-other');
      const i = needs.indexOf(needs.find(n => /Something else|其他需求/.test(n)));
      if (needsOther && i >= 0) needs[i] = needsOther;
      const body = {
        name: $('f-name').value.trim(),
        email: $('f-email').value.trim(),
        who,
        needs,
        tracking: picked('#tracking').join(', ') || null,
        message: $('f-msg').value.trim() || null
      };
      if (!body.name || !body.email) { msg.textContent = '留下名字和電子郵件，我們才回得了信。'; msg.className = 'form-msg bad'; return; }
      $('send').disabled = true; msg.textContent = '送出中…'; msg.className = 'form-msg';
      const res = await fetch('https://cpsdkarncveeemrfmkll.supabase.co/rest/v1/business_inquiries', {
        method: 'POST',
        headers: {
          apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwc2RrYXJuY3ZlZWVtcmZta2xsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzQ3NzAsImV4cCI6MjA5NjE1MDc3MH0.zzHVArTaz2OdW1pYEzMIlrgcyuXWm4MNnR-bizyRhdY',
          'Content-Type': 'application/json', Prefer: 'return=minimal'
        },
        body: JSON.stringify(body)
      }).catch(() => null);
      $('send').disabled = false;
      if (res && res.ok) { $('biz').style.display = 'none'; $('thanks').style.display = 'block'; }
      else { msg.textContent = '沒有送出去，再試一次？'; msg.className = 'form-msg bad'; }
    });
  })();
</script>
</body>
</html>
