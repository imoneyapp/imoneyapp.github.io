# Keeps the "Sign in with Apple" client secret for withimoney.com alive forever.
#
# Apple client secrets are short-lived JWTs (max 6 months). When one lapses,
# website Apple sign-in breaks with "Unsupported provider: missing OAuth secret".
# This job regenerates the secret and pushes it to Supabase every month, so it
# is always fresh with a wide safety margin (each secret is valid 180 days).
#
# Secrets to configure in repo Settings → Secrets and variables → Actions:
#   APPLE_P8_KEY           contents of the Apple AuthKey_XXXX.p8 file
#   SUPABASE_ACCESS_TOKEN  a Supabase personal access token
# The non-secret IDs below are safe to keep in the clear.
name: Refresh Apple Sign-in secret

on:
  schedule:
    - cron: '0 3 1 * *'   # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: apple-secret-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rotate Apple client secret in Supabase
        env:
          APPLE_P8_KEY:          ${{ secrets.APPLE_P8_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLE_KEY_ID:          R6JQYD7HS3
          APPLE_TEAM_ID:         DNAQSGZS6D
          APPLE_SERVICES_ID:     co.up.imoney.web
          SUPABASE_PROJECT_REF:  cpsdkarncveeemrfmkll
        run: node scripts/refresh-apple-secret.mjs
