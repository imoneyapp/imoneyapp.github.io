<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iMoney is out — get the app</title>
  <meta name="description" content="iMoney is on the App Store. Sign in with the same Apple or Google account you reserved with, and your @handle is waiting.">
  <meta property="og:title" content="iMoney is out">
  <meta property="og:description" content="Your @handle is waiting inside the app.">
  <meta property="og:image" content="https://withimoney.com/assets/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png?v=2">
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon-256.png?v=2">
  <link rel="apple-touch-icon" href="/assets/appicon.png">
  <link rel="stylesheet" href="../style.css?v=27">
  <style>
    /* Same centred single-purpose shape as the invite page (/i/) — this
       page has exactly one thing to say and one button to press. */
    .out { text-align: center; padding-top: 8vh; }
    .out .mark { height: 84px; width: auto; }
    .out h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 22px 0 10px; }
    .out .sub { color: var(--bone-dim); margin: 0 auto 36px; max-width: 30ch; }
    .out .get {
      display: inline-block; padding: 14px 34px; border-radius: 999px;
      background: var(--bone); color: #10110F; font-weight: 700; text-decoration: none;
      font-size: 17px;
    }
    .out .held {
      display: block; margin-top: 26px; color: var(--bone-dim); font-size: 14px;
      max-width: 34ch; margin-left: auto; margin-right: auto; line-height: 1.55;
    }
    .out .held strong { color: var(--bone); font-weight: 600; }
  </style>
</head>
<body>
<main>
  <header class="site"><a href="/">iMoney</a></header>
  <div class="out">
    <img class="mark" src="../assets/logo-mark.png" alt="iMoney">
    <h1 id="title">iMoney is out.</h1>
    <p class="sub" id="sub">The waiting list is over — the app is on the App Store.</p>
    <a class="get" id="get" href="https://apps.apple.com/app/id6786223859">Download on the App Store</a>
    <span class="held" id="held">
      Reserved a name? Sign in with the <strong>same Apple or Google account
      you reserved with</strong> — your @handle is waiting for you inside.
    </span>
  </div>
  <script>
    // The old flow sent Chinese visitors here as /reserve/?lang=zh, and the
    // browser's own language covers everyone else. One page, both readings.
    (function () {
      var forced = new URLSearchParams(location.search).get("lang") || "";
      var zh = forced.toLowerCase().indexOf("zh") === 0 ||
               (!forced && (navigator.language || "").toLowerCase().indexOf("zh") === 0);
      if (!zh) return;
      document.documentElement.lang = "zh-Hant";
      document.getElementById("title").textContent = "iMoney 上線了。";
      document.getElementById("sub").textContent = "等待結束——App 已經在 App Store 上架。";
      document.getElementById("get").textContent = "在 App Store 下載";
      document.getElementById("held").innerHTML =
        '預留過名字嗎？請用<strong>當初預留時的同一組 Apple 或 Google 帳號</strong>登入' +
        '——你的 @帳號 已經在裡面等你了。';
    })();
  </script>
  <footer>© 2026 iMoney · <a href="../privacy/">Privacy</a> · <a href="../terms/">Terms</a> · <a href="../support/">Support</a></footer>
</main>
</body>
</html>
