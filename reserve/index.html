<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserve @yourname — iMoney</title>
  <meta name="description" content="Claim your name on iMoney before it launches. Sign in once; it'll be waiting when the app arrives.">
  <meta property="og:title" content="Reserve @yourname on iMoney">
  <meta property="og:description" content="Claim your name before it launches.">
  <meta property="og:image" content="https://withimoney.com/assets/appicon.png">
  <link rel="stylesheet" href="../assets/card.css?v=13">
  <style>
    /* Palette mirrors the app: ink ground, bone type, the gold accent. */
    :root {
      --ink: #0b0b0c; --ink-raised: #161617; --bone: #f4f1ea;
      --bone-dim: #a8a49c; --bone-faint: #6f6c66;
      --accent: #d9b36a; --negative: #e64a3c; --positive: #4caf7d;
      --hairline: rgba(244,241,234,.12);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100svh; background: var(--ink); color: var(--bone);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 28px 20px; text-align: center;
    }
    .wrap { width: 100%; max-width: 420px; }
    h1 { font-size: 27px; font-weight: 700; margin: 22px 0 6px; letter-spacing: -.3px; }
    p.sub { color: var(--bone-dim); font-size: 14px; margin: 0 0 26px; }
    .mark { width: 54px; height: 54px; }

    /* The member card — same anatomy as the one in the app, and it turns
       the same way. Two nested wrappers because a single element can't
       run a bob and a spin on `transform` at once without them fighting:
       .float owns the vertical drift, .card owns the rotation. */
    .scene { perspective: 1400px; width: 100%; margin-top: 30px; }
    .float { animation: bob 7s ease-in-out infinite; }
    .card {
      position: relative; width: 100%; aspect-ratio: 1.586;
      transform-style: preserve-3d;
      animation: spin 24s linear infinite;
    }
    .card:hover, .card:active { animation-play-state: paused; }
    @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
    @keyframes bob  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .face {
      position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border: 1px solid rgba(217,179,106,.35);
      box-shadow: 0 18px 40px rgba(0,0,0,.55);
      background: linear-gradient(135deg, rgba(217,179,106,.62), rgba(217,179,106,.24)), var(--ink);
    }
    .face.back { transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; }
    .face.back img { width: 34%; opacity: .55; }
    .face::after {                    /* the travelling light seam */
      content: ""; position: absolute; inset: -30%;
      background: linear-gradient(105deg, transparent 38%, rgba(217,179,106,.55) 48%,
                  rgba(244,241,234,.22) 53%, transparent 62%);
      animation: sweep 7s ease-in-out infinite;
    }
    @keyframes sweep { 0%,100% { transform: translateX(-22%); } 50% { transform: translateX(22%); } }

    /* text-align:left matters — the page is centred, and without this the
       handle and footer centre themselves and stop matching the app. */
    .card-inner { position: absolute; inset: 0; padding: 6.2%; display: flex;
                  flex-direction: column; z-index: 1; text-align: left; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between;
                flex: 0 0 auto; }
    /* NOT a percentage height. A % height against an indefinite parent makes
       the image contribute its INTRINSIC height (612px) to the flex row while
       painting small — which crushed the handle and footer to zero. */
    .card-top img { height: clamp(22px, 8vw, 34px); width: auto; }
    .card-handle, .card-foot { flex: 0 0 auto; min-height: 0; }
    .card-date { font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                 color: rgba(11,11,12,.55); letter-spacing: .8px; }
    .card-handle { font-size: clamp(26px, 12.5vw, 46px); font-weight: 700; color: var(--ink);
                   margin: auto 0; letter-spacing: -1px; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; }
    .card-foot { font-size: 11px; color: rgba(11,11,12,.62); }
    .card-foot span { display: block; font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
                      text-transform: uppercase; color: rgba(11,11,12,.4); margin-bottom: 2px; }

    /* Someone who's asked for less motion gets a still card, not a
       spinning one — this is decoration, not information. */
    @media (prefers-reduced-motion: reduce) {
      .float, .card, .face::after { animation: none; }
      .card { transform: rotateY(-9deg); }
    }

    .row { display: flex; gap: 8px; margin-top: 26px; }
    input {
      flex: 1; min-width: 0; background: var(--ink-raised); color: var(--bone);
      border: 1px solid var(--hairline); border-radius: 14px; padding: 14px 16px;
      font-size: 16px; font-family: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--bone); color: var(--ink); border: 0; border-radius: 14px;
      padding: 14px 22px; font-weight: 600; font-size: 15px; line-height: 1; cursor: pointer; font-family: inherit;
    }
    button:disabled { opacity: .4; cursor: default; }
    button.ghost { background: transparent; color: var(--bone-dim); padding: 10px; font-weight: 500; }
    /* Both providers get the same shape so neither reads as the "real" one;
       only the fill differs, so there's still a visual primary. */
    .oauth { display: inline-flex; align-items: center; gap: 10px; justify-content: center;
             width: 100%; margin-bottom: 10px; background: var(--ink-raised);
             color: var(--bone); border: 1px solid var(--hairline); }
    .oauth.primary { background: var(--bone); color: var(--ink); border-color: transparent; }
    .oauth svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .note { font-size: 13px; color: var(--bone-faint); margin-top: 14px; }
    #share { margin-top: 20px; width: 100%; }
    .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
    .msg.bad { color: var(--negative); } .msg.good { color: var(--positive); }
    .hidden { display: none !important; }
    .at { color: var(--bone-faint); }
  </style>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/appicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
  <div class="wrap">
    <img class="mark" src="../assets/logo-mark.png" alt="iMoney">

    <!-- 0. Already an iMoney account. Checked before reservations, because
         a real account outranks a held name — offering to reserve a handle
         to somebody who already has one is the page telling them it doesn't
         know who they are. -->
    <section id="step-have" class="hidden">
      <h1 id="have-handle">@you</h1>
      <p class="sub" id="have-sub">is already yours.</p>
      <p class="note" id="have-note">You signed up in the app. Nothing to reserve.</p>
      <button class="ghost" id="have-signout">Use another account</button>
    </section>

    <!-- 1. Signed out -->
    <section id="step-in">
      <h1>Reserve @yourname</h1>
      <p class="sub">Claim your name before iMoney launches.</p>
      <button class="oauth primary" id="apple">
        <svg viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        Continue with Apple
      </button>
      <button class="oauth" id="google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.7-.4-3.9H24v7.1h12.1c-.2 1.8-1.6 4.6-4.5 6.5l6.9 5.3c4.1-3.8 6.6-9.4 6.6-15z"/>
          <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.3c-1.8 1.3-4.3 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.1l-7.1 5.5C8.1 41.1 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.5 28.5c-.5-1.4-.7-2.9-.7-4.5s.3-3.1.7-4.5l-7.1-5.5C2.9 17 2 20.4 2 24s.9 7 2.4 10l7.1-5.5z"/>
          <path fill="#EA4335" d="M24 10.6c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.4 29.9 2 24 2 15.4 2 8.1 6.9 4.4 14l7.1 5.5C13.3 14.4 18.2 10.6 24 10.6z"/>
        </svg>
        Continue with Google
      </button>
      <p class="note">minimal. social. weirdly addictive.</p>
    </section>

    <!-- 2. Signed in, choosing -->
    <section id="step-pick" class="hidden">
      <h1>Pick your name</h1>
      <p class="sub">2–20 characters: a–z, 0–9, _</p>
      <div class="row">
        <input id="handle" placeholder="handle" autocapitalize="none" autocorrect="off"
               spellcheck="false" maxlength="20" inputmode="latin">
        <button id="claim">Reserve</button>
      </div>
      <p class="msg" id="msg"></p>
      <button class="ghost" id="signout">Sign out</button>
    </section>

    <!-- 3. Done -->
    <section id="step-done" class="hidden">
      <div class="scene">
        <div class="float">
          <div class="card turning">
            <div class="face front">
              <div class="card-inner">
                <div class="card-top">
                  <img src="../assets/logo-ink-star.png" alt="iMoney">
                  <div class="card-date" id="card-date"></div>
                </div>
                <div class="card-handle" id="card-handle">@you</div>
                <div class="card-foot">
                  <span>Member</span>
                  <div id="card-no">—</div>
                </div>
              </div>
            </div>
            <div class="face back">
              <img src="../assets/logo-ink-star.png" alt="">
            </div>
          </div>
        </div>
      </div>

      <h1 id="done-handle">@you</h1>
      <p class="sub">is yours.</p>
      <p class="note">Spending is the art of knowing yourself.</p>
      <button id="share">Share my card</button>
      <button class="ghost" id="change">Change my name</button>
    </section>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';

    // Anon key — public by design. Every table this page can reach is behind
    // RLS, and reserving goes through a SECURITY DEFINER function that checks
    // availability server-side.
    const sb = createClient(
      'https://cpsdkarncveeemrfmkll.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwc2RrYXJuY3ZlZWVtcmZta2xsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzQ3NzAsImV4cCI6MjA5NjE1MDc3MH0.zzHVArTaz2OdW1pYEzMIlrgcyuXWm4MNnR-bizyRhdY'
    );

    // One reserve page, two languages. A second copy of this file would
    // have to keep its auth logic in sync forever; a dictionary can't drift.
    // ?lang wins (the landing pages pass it), otherwise the browser decides.
    const param = new URLSearchParams(location.search).get('lang');
    const ZH = param ? param.startsWith('zh')
                     : (navigator.language || '').toLowerCase().startsWith('zh');
    const T = ZH ? {
      title: '預約 @yourname', pickTitle: '選一個名字',
      inTitle: '預約 @yourname',
      inSub: '在 iMoney 上線前，先把名字定下來。',
      pickSub: '2–20 個字元：a–z、0–9、_',
      privacy: '極簡、社群，而且莫名上癮。',
      apple: '用 Apple 繼續', google: '用 Google 繼續',
      reserve: '預約', cancel: '取消', signout: '登出',
      change: '換一個名字', share: '分享我的卡片',
      haveSub: '已經是你的了。', haveNote: '你已經在 App 裡註冊過，不用再預約。',
      haveSwitch: '換一個帳號',
      isYours: '是你的了。', slogan: '花錢，是一門認識自己的藝術。',
      bad: '只能用 2–20 個 a–z、0–9、_。',
      taken: '這個名字已經有人用了，換一個？',
      failed: '預約失敗，再試一次？', checking: '檢查中…'
    } : null;

    const $ = id => document.getElementById(id);
    const show = name => ['have','in','pick','done'].forEach(s =>
      $('step-' + s).classList.toggle('hidden', s !== name));
    const say = (text, kind) => { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); };

    // Padded to four digits so the corner never changes width as the queue
    // grows, and so the first person's card doesn't read as an afterthought.
    const cardNo = n => 'NO. ' + String(n).padStart(4, '0');
    let reservationNo = null;

    function renderCard(handle, no) {
      $('card-handle').textContent = '@' + handle;
      $('done-handle').textContent = '@' + handle;
      if (no != null) { reservationNo = no; $('card-no').textContent = cardNo(no); }
      $('card-date').textContent =
        new Date().toLocaleDateString(undefined, { month: 'short', year: 'numeric' }).toUpperCase();
    }

    // handle + number in one call. my_handle_reservation() is left alone —
    // the iOS app calls it during onboarding and only wants the name.
    async function myReservation() {
      const { data } = await sb.rpc('my_reservation');
      return Array.isArray(data) ? data[0] : data;
    }

    // A handle typed on the landing page rides in on ?h= — prefill it so
    // nobody types their own name twice.
    const wanted = new URLSearchParams(location.search).get('h');

    async function refresh() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { show('in'); return; }
      // A real profile means this identity already IS an iMoney user — the
      // same auth.users row the app signed them in with. RLS lets them read
      // their own row and nobody else's.
      const { data: prof } = await sb.from('profiles')
        .select('handle').eq('id', session.user.id).maybeSingle();
      if (prof && prof.handle) {
        $('have-handle').textContent = '@' + prof.handle;
        show('have'); return;
      }

      const mine = await myReservation();
      if (mine && mine.handle) { renderCard(mine.handle, mine.reservation_no); show('done'); return; }
      if (wanted && !$('handle').value) $('handle').value = wanted.replace(/^@/, '');
      show('pick');
    }

    // Back to this exact page. Both providers must also be listed under
    // Supabase → Authentication → URL Configuration → Redirect URLs.
    const oauth = provider => sb.auth.signInWithOAuth({
      provider,
      options: { redirectTo: window.location.href.split('#')[0] }
    });
    $('google').onclick = () => oauth('google');
    $('apple').onclick  = () => oauth('apple');

    const signOut = async () => { await sb.auth.signOut(); show('in'); };
    $('signout').onclick = signOut;
    $('have-signout').onclick = signOut;
    $('change').onclick = () => { $('handle').value = ''; show('pick'); say(''); };

    $('claim').onclick = async () => {
      const handle = $('handle').value.trim().toLowerCase().replace(/^@/, '');
      if (!/^[a-z0-9_]{2,20}$/.test(handle)) {
        return say(T ? T.bad : '2–20 characters, and only a–z, 0–9, _', 'bad');
      }
      $('claim').disabled = true; say(T ? T.checking : 'Checking…');
      const { data, error } = await sb.rpc('reserve_handle', { p_handle: handle });
      $('claim').disabled = false;
      if (error) {
        const taken = /handle_taken/.test(error.message);
        return say(taken ? (T ? T.taken : 'That one’s gone. Try another?')
                         : (T ? T.failed : 'Couldn’t reserve that. Try again?'), 'bad');
      }
      // reserve_handle returns the handle; the number comes back from the
      // row it just wrote.
      const mine = await myReservation();
      renderCard(data, mine && mine.reservation_no);
      show('done');
    };

    $('handle').addEventListener('keydown', e => { if (e.key === 'Enter') $('claim').click(); });

    // --- Share -------------------------------------------------------------
    // Drawn on a canvas rather than screenshotting the DOM: no html2canvas
    // dependency, and it produces the same 1080×1920 the app exports so a
    // card shared from the web and one shared from the app are one artifact.
    const logo = new Image();
    logo.src = '../assets/logo-ink-star.png';

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y,     x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x,     y + h, r);
      ctx.arcTo(x,     y + h, x,     y,     r);
      ctx.arcTo(x,     y,     x + w, y,     r);
      ctx.closePath();
    }

    function drawCard(handle) {
      const W = 1080, H = 1920;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');

      ctx.fillStyle = '#0b0b0c';
      ctx.fillRect(0, 0, W, H);
      // Warm bloom behind the card, same as the app's story view.
      const bloom = ctx.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, W*0.9);
      bloom.addColorStop(0, 'rgba(217,179,106,.28)');
      bloom.addColorStop(1, 'rgba(217,179,106,0)');
      ctx.fillStyle = bloom; ctx.fillRect(0, 0, W, H);

      // The card, ID-1 proportions.
      const cw = W * 0.82, ch = cw / 1.586;
      const cx = (W - cw) / 2, cy = H * 0.30 - ch / 2;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30;
      roundRect(ctx, cx, cy, cw, ch, cw * 0.055);
      const face = ctx.createLinearGradient(cx, cy, cx + cw, cy + ch);
      face.addColorStop(0, '#c8a463'); face.addColorStop(1, '#6d5a37');
      ctx.fillStyle = face; ctx.fill();
      ctx.restore();

      // Light seam across the face.
      ctx.save();
      roundRect(ctx, cx, cy, cw, ch, cw * 0.055); ctx.clip();
      const seam = ctx.createLinearGradient(cx + cw * 0.15, cy, cx + cw * 0.75, cy + ch);
      seam.addColorStop(0,   'rgba(255,255,255,0)');
      seam.addColorStop(0.45,'rgba(255,255,255,.34)');
      seam.addColorStop(0.6, 'rgba(255,255,255,.10)');
      seam.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = seam; ctx.fillRect(cx, cy, cw, ch);
      ctx.restore();

      const pad = cw * 0.062;
      if (logo.complete && logo.naturalWidth) {
        const lh = cw * 0.085, lw = lh * (logo.naturalWidth / logo.naturalHeight);
        ctx.drawImage(logo, cx + pad, cy + pad, lw, lh);
      }
      ctx.fillStyle = 'rgba(11,11,12,.55)';
      ctx.font = '700 ' + Math.round(cw * 0.030) + 'px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'right';
      ctx.fillText(new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
                   .toUpperCase(), cx + cw - pad, cy + pad + cw * 0.030);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#0b0b0c';
      ctx.font = '700 ' + Math.round(cw * 0.125) + 'px -apple-system, "SF Pro Display", system-ui, sans-serif';
      ctx.fillText('@' + handle, cx + pad, cy + ch * 0.58);

      ctx.fillStyle = 'rgba(11,11,12,.4)';
      ctx.font = '700 ' + Math.round(cw * 0.024) + 'px -apple-system, system-ui, sans-serif';
      ctx.fillText('MEMBER', cx + pad, cy + ch - pad - cw * 0.042);
      ctx.fillStyle = 'rgba(11,11,12,.62)';
      ctx.font = '600 ' + Math.round(cw * 0.036) + 'px -apple-system, system-ui, sans-serif';
      ctx.fillText(reservationNo != null ? cardNo(reservationNo) : 'Reserved',
                   cx + pad, cy + ch - pad);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#f4f1ea';
      ctx.font = '700 ' + Math.round(W * 0.085) + 'px -apple-system, "SF Pro Display", system-ui, sans-serif';
      ctx.fillText('@' + handle, W / 2, cy + ch + W * 0.19);
      ctx.fillStyle = '#a8a49c';
      ctx.font = '500 ' + Math.round(W * 0.036) + 'px -apple-system, system-ui, sans-serif';
      ctx.fillText('Spending is the art of knowing yourself.', W / 2, cy + ch + W * 0.255);
      ctx.fillStyle = 'rgba(244,241,234,.62)';
      ctx.font = '600 ' + Math.round(W * 0.038) + 'px -apple-system, system-ui, sans-serif';
      ctx.fillText('withimoney.com', W / 2, H - W * 0.10);

      return cv;
    }

    $('share').onclick = async () => {
      const handle = $('card-handle').textContent.replace(/^@/, '');
      const canvas = drawCard(handle);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const file = new File([blob], 'imoney-' + handle + '.png', { type: 'image/png' });
      // Native sheet where it exists (iOS Safari, Android); a download
      // everywhere else, so desktop still gets the file.
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch { return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    if (T) {
      document.documentElement.lang = 'zh-Hant';
      document.title = T.title + ' — iMoney';
      const set = (sel, txt) => { const el = document.querySelector(sel); if (el) el.textContent = txt; };
      set('#step-in h1', T.inTitle);
      set('#step-in .sub', T.inSub);
      set('#step-pick h1', T.pickTitle);
      set('#step-pick .sub', T.pickSub);
      set('#step-in .note', T.privacy);
      $('apple').lastChild.textContent = ' ' + T.apple;
      $('google').lastChild.textContent = ' ' + T.google;
      set('#claim', T.reserve);
      set('#signout', T.signout);
      set('#change', T.change);
      set('#share', T.share);
      set('#step-done .sub', T.isYours);
      set('#step-done .note', T.slogan);
      set('#have-sub', T.haveSub);
      set('#have-note', T.haveNote);
      set('#have-signout', T.haveSwitch);
      $('handle').placeholder = 'yourname';
    }

    // Fires on load AND after the OAuth redirect drops the session in.
    sb.auth.onAuthStateChange(() => refresh());
    refresh();
  </script>
</body>
</html>
