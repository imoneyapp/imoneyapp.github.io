<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserve @yourname — iMoney</title>
  <meta name="description" content="Claim your name on iMoney before it launches. Sign in once; it'll be waiting when the app arrives.">
  <meta property="og:title" content="Reserve @yourname on iMoney">
  <meta property="og:description" content="Claim your name before it launches.">
  <meta property="og:image" content="https://withimoney.com/assets/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="stylesheet" href="../assets/card.css?v=35">
  <style>
    /* Palette mirrors the app: ink ground, bone type, the gold accent. */
    :root {
      --ink: #0b0b0c; --ink-raised: #161617; --bone: #f4f1ea;
      --bone-dim: #a8a49c; --bone-faint: #6f6c66;
      --accent: #d9b36a; --negative: #e64a3c; --positive: #4caf7d;
      --hairline: rgba(244,241,234,.12);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100svh; background: var(--ink); color: var(--bone);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 28px 20px; text-align: center;
    }
    .wrap { width: 100%; max-width: 420px; }
    h1 { font-size: 27px; font-weight: 700; margin: 22px 0 6px; letter-spacing: -.3px; }
    p.sub { color: var(--bone-dim); font-size: 14px; margin: 0 0 26px; }
    #brand { display: inline-block; color: var(--bone); text-decoration: none;
             font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
             font-size: 26px; font-weight: 800; letter-spacing: -.4px; }
    #brand .mark { width: 54px; height: 54px; display: inline-block; }
    #brand .brandword { display: none; }
    #brand.worded .mark { display: none; }
    #brand.worded .brandword { display: inline-block; }

    /* The member card — same anatomy as the one in the app, and it turns
       the same way. Two nested wrappers because a single element can't
       run a bob and a spin on `transform` at once without them fighting:
       .float owns the vertical drift, .card owns the rotation. */
    /* The turn: honest 3D this time. ONE preserve-3d turner owns the
       rotation; the metal sheets are real planes spread along Z inside
       it, so they can never slip or tilt against the card — edge-on they
       fan into a milled side, face-on they hide behind the face. The
       faces sit at ±Z with true backface culling: no swap, no mirror
       hack, no pop at 90°. */
    .scene { width: 100%; margin-top: 30px; }
    .float { animation: bob 7s ease-in-out infinite; }
    .stack { position: relative; width: 100%; aspect-ratio: 1.586;
             perspective: 1400px; }
    .turn3d { position: absolute; inset: 0; transform-style: preserve-3d;
              will-change: transform; }
    .plane { position: absolute; inset: 0; border-radius: 22px; }
    .sheet-pl {
      background: linear-gradient(180deg, #e2dfd9 0%, #a5a29c 55%, #5f5e5a 100%);
      border: 1px solid rgba(70,68,64,.9);
    }
    @keyframes bob  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .face {
      position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
      -webkit-backface-visibility: hidden; backface-visibility: hidden;
      /* Same milled rim as the claim card: bright wall top/left, shaded
         wall bottom/right, dark outer ring for the side that turns away. */
      border: 1px solid rgba(70,68,64,.9);
      box-shadow: 0 18px 40px rgba(0,0,0,.55),
                  inset 0 2.5px 1px -0.5px rgba(255,255,255,.95),
                  inset 2.5px 0 1px -0.5px rgba(255,255,255,.55),
                  inset 0 -2.5px 1px -0.5px rgba(42,41,38,.8),
                  inset -2.5px 0 1px -0.5px rgba(52,51,48,.6);
      background: linear-gradient(135deg, #e8e6e1 0%, #b9b7b2 30%, #d8d6d1 52%, #a7a5a1 76%, #6f6e6b 100%);
    }
    /* The card's two skins: front floats at +Z, back at -Z pre-turned
       180° so it reads correctly when the rotation brings it around.
       WebKit's backface culling is unreliable here (the back's mark
       bleeds through the front as a ghost — the same bug card.css works
       around), so JS shows one skin at a time; the swap lands at 90°,
       when the card is a sliver and nothing can be seen changing. */
    .face.front { transform: translateZ(4.2px); }
    .face.back  { display: none; align-items: center; justify-content: center;
                  transform: rotateY(180deg) translateZ(4.2px); }
    .turn3d.showback .face.front { display: none; }
    .turn3d.showback .face.back  { display: flex; }
    .face.back img { width: 34%; opacity: .55; }
    .face::after {                    /* the travelling light seam */
      content: ""; position: absolute; inset: -30%;
      background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.5) 48%,
                  rgba(244,241,234,.24) 53%, transparent 62%);
      animation: sweep 7s ease-in-out infinite;
    }
    @keyframes sweep { 0%,100% { transform: translateX(-22%); } 50% { transform: translateX(22%); } }

    /* text-align:left matters — the page is centred, and without this the
       handle and footer centre themselves and stop matching the app. */
    .card-inner { position: absolute; inset: 0; padding: 6.2%; display: flex;
                  flex-direction: column; z-index: 1; text-align: left; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between;
                flex: 0 0 auto; }
    /* NOT a percentage height. A % height against an indefinite parent makes
       the image contribute its INTRINSIC height (612px) to the flex row while
       painting small — which crushed the handle and footer to zero. */
    /* Same ink weight as the engraving — full black floated off the
       metal and shouted over the handle. */
    .card-top img { height: clamp(22px, 8vw, 34px); width: auto; opacity: .78; }
    .card-handle, .card-foot { flex: 0 0 auto; min-height: 0; }
    /* Corner text is styled ENTIRELY by card.css — the same .card-meta
       classes the claim card uses, so the two cards are one design. */
    .card-handle { font-size: clamp(26px, 12.5vw, 46px); font-weight: 700; color: var(--ink);
                   margin: auto 0; letter-spacing: -1px; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; }

    /* The reserved name below the card wears the planet, like the claim
       page headline. */
    #done-handle {
      background: linear-gradient(104deg,
        #ff9357 0%, #ffe9dc 16%, #f6aed3 34%, #5b9bd4 56%,
        #2f6ba6 76%, #454065 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Share destinations: the sheet's row, on the web. IG Story leads
       with the planet ramp; the rest are quiet circles. */
    #share { width: 100%; margin-top: 24px; }

    /* Someone who's asked for less motion gets a still card, not a
       spinning one — this is decoration, not information. */
    @media (prefers-reduced-motion: reduce) {
      .float, .face::after { animation: none; }
    }

    .row { display: flex; gap: 8px; margin-top: 26px; }
    input {
      flex: 1; min-width: 0; background: var(--ink-raised); color: var(--bone);
      border: 1px solid var(--hairline); border-radius: 14px; padding: 14px 16px;
      font-size: 16px; font-family: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--bone); color: var(--ink); border: 0; border-radius: 14px;
      padding: 14px 22px; font-weight: 600; font-size: 15px; line-height: 1; cursor: pointer; font-family: inherit;
    }
    button:disabled { opacity: .4; cursor: default; }
    button.ghost { background: transparent; color: var(--bone-dim); padding: 10px; font-weight: 500; }
    /* Both providers get the same shape so neither reads as the "real" one;
       only the fill differs, so there's still a visual primary. */
    .oauth { display: inline-flex; align-items: center; gap: 10px; justify-content: center;
             width: 100%; margin-bottom: 10px; background: var(--ink-raised);
             color: var(--bone); border: 1px solid var(--hairline); }
    .oauth.primary { background: var(--bone); color: var(--ink); border-color: transparent; }
    .oauth svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .note { font-size: 13px; color: var(--bone-faint); margin-top: 14px; }
    /* The name in the title wears the planet, like the done page. */
    #pick-handle {
      background: linear-gradient(104deg,
        #ff9357 0%, #ffe9dc 16%, #f6aed3 34%, #5b9bd4 56%,
        #2f6ba6 76%, #454065 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #pick-handle { font-size: 36px; margin-bottom: 4px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #step-pick .sub { margin-bottom: 22px; }
    #step-pick #claim { width: 100%; }
    #step-pick .ghost { margin-top: 10px; }
    #share { margin-top: 20px; width: 100%; }
    .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
    .msg.bad { color: var(--negative); } .msg.good { color: var(--positive); }
    .hidden { display: none !important; }
    .at { color: var(--bone-faint); }
  </style>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png?v=2">
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon-256.png?v=2">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
</head>
<body>
  <div class="wrap">
    <!-- The header is the MARK on every step — except the done page,
         where the card already draws the star twice and the header
         switches to the wordmark so it isn't a third. -->
    <a href="/" id="brand" aria-label="iMoney home"><img class="mark" src="../assets/logo-mark.png" alt="iMoney"><span class="brandword">iMoney</span></a>

    <!-- 0. Already an iMoney account. Checked before reservations, because
         a real account outranks a held name — offering to reserve a handle
         to somebody who already has one is the page telling them it doesn't
         know who they are. -->
    <section id="step-have" class="hidden">
      <h1 id="have-handle">@you</h1>
      <p class="sub" id="have-sub">is already yours.</p>
      <p class="note" id="have-note">Stay focused, and grow with it.</p>
      <button class="ghost" id="have-signout">Use another account</button>
    </section>

    <!-- 1. Signed out -->
    <section id="step-in">
      <h1>Reserve @yourname</h1>
      <p class="sub">Claim your name before iMoney launches.</p>
      <button class="oauth primary" id="apple">
        <svg viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        Continue with Apple
      </button>
      <button class="oauth" id="google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.7-.4-3.9H24v7.1h12.1c-.2 1.8-1.6 4.6-4.5 6.5l6.9 5.3c4.1-3.8 6.6-9.4 6.6-15z"/>
          <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.3c-1.8 1.3-4.3 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.1l-7.1 5.5C8.1 41.1 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.5 28.5c-.5-1.4-.7-2.9-.7-4.5s.3-3.1.7-4.5l-7.1-5.5C2.9 17 2 20.4 2 24s.9 7 2.4 10l7.1-5.5z"/>
          <path fill="#EA4335" d="M24 10.6c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.4 29.9 2 24 2 15.4 2 8.1 6.9 4.4 14l7.1 5.5C13.3 14.4 18.2 10.6 24 10.6z"/>
        </svg>
        Continue with Google
      </button>
    </section>

    <!-- 2. Signed in, choosing -->
    <section id="step-pick" class="hidden">
      <!-- They chose on /claim/ and signed in — nothing is left to type.
           The name stands alone, the promise sits under it, and the only
           choices are through or back. Arriving with no name (or one that
           turns out taken) routes back to the claim page, where names are
           actually chosen. -->
      <h1 id="pick-handle">@yourname</h1>
      <p class="sub" id="pick-rest">is almost yours.</p>
      <p class="msg" id="msg"></p>
      <button id="claim">Continue</button>
      <button class="ghost" id="signout">Cancel</button>
    </section>

    <!-- 3. Done -->
    <section id="step-done" class="hidden">
      <div class="scene">
        <div class="float">
          <div class="stack" id="cardstack">
            <div class="turn3d" id="turncard">
              <div class="plane sheet-pl" style="transform:translateZ(-3px)"></div>
              <div class="plane sheet-pl" style="transform:translateZ(-1px)"></div>
              <div class="plane sheet-pl" style="transform:translateZ(1px)"></div>
              <div class="plane sheet-pl" style="transform:translateZ(3px)"></div>
              <div class="face front">
                <div class="card-inner">
                  <div class="card-top">
                    <img src="../assets/logo-ink-star.png" alt="iMoney">
                    <div class="card-meta engraved" id="card-date"></div>
                  </div>
                  <div class="card-handle" id="card-handle">@you</div>
                  <div class="card-foot">
                    <div class="card-meta left engraved">Member</div>
                    <div class="card-meta engraved" id="card-no">—</div>
                  </div>
                </div>
              </div>
              <div class="face back">
                <img src="../assets/logo-ink-star.png" alt="">
              </div>
            </div>
          </div>
        </div>
      </div>

      <h1 id="done-handle">@you</h1>
      <p class="sub">is reserved for you.</p>
      <button id="share">Share my card</button>
    </section>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';

    // Anon key — public by design. Every table this page can reach is behind
    // RLS, and reserving goes through a SECURITY DEFINER function that checks
    // availability server-side.
    const sb = createClient(
      'https://cpsdkarncveeemrfmkll.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwc2RrYXJuY3ZlZWVtcmZta2xsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzQ3NzAsImV4cCI6MjA5NjE1MDc3MH0.zzHVArTaz2OdW1pYEzMIlrgcyuXWm4MNnR-bizyRhdY'
    );

    // One reserve page, two languages. A second copy of this file would
    // have to keep its auth logic in sync forever; a dictionary can't drift.
    // ?lang wins (the landing pages pass it), otherwise the browser decides.
    const param = new URLSearchParams(location.search).get('lang');
    const ZH = param ? param.startsWith('zh')
                     : (navigator.language || '').toLowerCase().startsWith('zh');
    const T = ZH ? {
      title: '開放預留 @使用者名稱',
      inTitle: '開放預留 @使用者名稱',
      inSub: '在 iMoney 上線前，先把名字定下來。',
      cont: '繼續',
      almost: '快是你的了。',
      apple: '用 Apple 繼續', google: '用 Google 繼續',
      cancel: '取消',
      share: '分享我的卡片',
      haveSub: '已經是你的了。', haveNote: '保持專注，繼續成長。',
      haveSwitch: '換一個帳號',
      isYours: '已為你保留。',
      bad: '只能用 2–20 個 a–z、0–9、_。',
      taken: '這個名字已經有人用了，換一個？',
      failed: '預約失敗，再試一次？', checking: '檢查中…'
    } : null;

    const $ = id => document.getElementById(id);
    const show = name => {
      ['have','in','pick','done'].forEach(s =>
        $('step-' + s).classList.toggle('hidden', s !== name));
      // The header wears the mark everywhere except over the card.
      document.getElementById('brand').classList.toggle('worded', name === 'done');
    };
    const say = (text, kind) => { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); };

    // Padded to four digits so the corner never changes width as the queue
    // grows, and so the first person's card doesn't read as an afterthought.
    const cardNo = n => 'NO. ' + String(n).padStart(4, '0');
    let reservationNo = null;

    function renderCard(handle, no) {
      $('card-handle').textContent = '@' + handle;
      $('done-handle').textContent = '@' + handle;
      if (no != null) { reservationNo = no; $('card-no').textContent = cardNo(no); }
      // "Aug. 2026", exactly as the claim card engraves it — the CSS
      // uppercases it into the plate style.
      const d = new Date();
      $('card-date').textContent =
        d.toLocaleDateString('en-US', { month: 'short' }) + ' ' + d.getFullYear();
    }

    // handle + number in one call. my_handle_reservation() is left alone —
    // the iOS app calls it during onboarding and only wants the name.
    async function myReservation() {
      const { data } = await sb.rpc('my_reservation');
      return Array.isArray(data) ? data[0] : data;
    }

    // A handle typed on the landing page rides in on ?h= — prefill it so
    // nobody types their own name twice.
    const wanted = new URLSearchParams(location.search).get('h');

    // A locked demo door: ?demo=ev&no=1&key=… shows the finished card
    // without any account — for recording the spin, IG stories, design
    // checks. The key never appears here, only its SHA-256, so reading
    // this source doesn't open the door. Render-only either way: it can
    // reserve nothing and reads nothing.
    const DEMO_LOCK = 'f24521a5e8f55eb39ef3364917f9afd49c81430ceee0d5b11cf9b59306aade7e';
    let DEMO = false;
    const demoGate = async () => {
      const qp = new URLSearchParams(location.search);
      const name = (qp.get('demo') || '').trim().toLowerCase().replace(/^@/, '');
      if (!/^[a-z0-9_]{2,20}$/.test(name)) return;
      const buf = await crypto.subtle.digest('SHA-256',
        new TextEncoder().encode(qp.get('key') || ''));
      const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      if (hex !== DEMO_LOCK) return;
      DEMO = true;
      const dn = parseInt(qp.get('no'), 10);
      renderCard(name, Number.isFinite(dn) ? dn : null);
      show('done');
    };

    async function refresh() {
      if (DEMO) return;   // the demo card is the whole page
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { show('in'); return; }
      // A real profile means this identity already IS an iMoney user — the
      // same auth.users row the app signed them in with. RLS lets them read
      // their own row and nobody else's.
      const { data: prof } = await sb.from('profiles')
        .select('handle').eq('id', session.user.id).maybeSingle();
      if (prof && prof.handle) {
        $('have-handle').textContent = '@' + prof.handle;
        show('have'); return;
      }

      const mine = await myReservation();
      if (mine && mine.handle) { renderCard(mine.handle, mine.reservation_no); show('done'); return; }
      const name = (wanted || '').trim().toLowerCase().replace(/^@/, '');
      if (!/^[a-z0-9_]{2,20}$/.test(name)) {
        location.replace(ZH ? '/zh/claim/' : '/claim/'); return;
      }
      $('pick-handle').textContent = '@' + name;
      show('pick');
    }

    // Back to this exact page. Both providers must also be listed under
    // Supabase → Authentication → URL Configuration → Redirect URLs.
    // prompt=select_account matters for "Use another account": without it
    // Google sees its own live session and silently signs the SAME account
    // back in — sign-out here doesn't sign you out of Google. Apple always
    // shows its own sheet, so it needs no nudge.
    const oauth = provider => sb.auth.signInWithOAuth({
      provider,
      options: {
        redirectTo: window.location.href.split('#')[0],
        queryParams: provider === 'google' ? { prompt: 'select_account' } : {}
      }
    });
    $('google').onclick = () => oauth('google');
    $('apple').onclick  = () => oauth('apple');

    const signOut = async () => { await sb.auth.signOut(); show('in'); };
    $('signout').onclick = signOut;
    $('have-signout').onclick = signOut;

    $('claim').onclick = async () => {
      const handle = $('pick-handle').textContent.replace(/^@/, '');
      $('claim').disabled = true; say(T ? T.checking : 'Checking…');
      const { data, error } = await sb.rpc('reserve_handle', { p_handle: handle });
      $('claim').disabled = false;
      if (error) {
        const taken = /handle_taken/.test(error.message);
        say(taken ? (T ? T.taken : 'That one’s gone. Try another?')
                  : (T ? T.failed : 'Couldn’t reserve that. Try again?'), 'bad');
        // With no field on this page, "another" lives back on the claim
        // page — carry them there after the message lands.
        if (taken) setTimeout(() => location.replace(ZH ? '/zh/claim/' : '/claim/'), 1800);
        return;
      }
      // reserve_handle returns the handle; the number comes back from the
      // row it just wrote.
      const mine = await myReservation();
      renderCard(data, mine && mine.reservation_no);
      show('done');
    };

    // --- Share -------------------------------------------------------------
    // Drawn on a canvas rather than screenshotting the DOM: no html2canvas
    // dependency, and it produces the same 1080×1920 the app exports so a
    // card shared from the web and one shared from the app are one artifact.
    const logo = new Image();
    logo.src = '../assets/logo-ink-star.png';
    // The cursive iMoney for the save-photo title — the ink alone, lifted
    // off its paper into a transparent PNG, so no plate ever prints.
    const cursive = new Image();
    cursive.src = '../assets/cursive-ink.png?v=1';

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y,     x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x,     y + h, r);
      ctx.arcTo(x,     y + h, x,     y,     r);
      ctx.arcTo(x,     y,     x + w, y,     r);
      ctx.closePath();
    }

    /* The save photo: the done page itself, held still — laid out on the
       canvas EXACTLY as the page lays it out on a phone (390pt-wide wrap,
       centred stack: wordmark, card, handle, line), on plain ink. */
    function drawCard(handle) {
      const W = 1080, H = 1920;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');

      ctx.fillStyle = '#0b0b0c';
      ctx.fillRect(0, 0, W, H);

      // The page's geometry, scaled: 390pt phone → 1080px canvas.
      const S = W / 390;
      const cw = 350 * S, ch = cw / 1.586;      // wrap-wide card
      const cx = (W - cw) / 2;
      // brand line + its gap, card, handle line + gaps, sub line — centred.
      const stackH = (31 + 30) * S + ch + (22 + 32 + 6 + 21) * S;
      const top = (H - stackH) / 2;
      const cy = top + (31 + 30) * S;

      // The wordmark, exactly where the page keeps it.
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f4f1ea';
      ctx.font = '800 ' + Math.round(26 * S) + 'px ui-rounded, -apple-system, "SF Pro Rounded", system-ui, sans-serif';
      ctx.fillText('iMoney', W / 2, top + 26 * S);

      // The card, face-on.
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 40 * S / 2.77; ctx.shadowOffsetY = 18 * S / 2.77;
      roundRect(ctx, cx, cy, cw, ch, 22 * S);
      // card.css's .face, verbatim: 128deg brushed silver, all 8 stops —
      // the SAME metal the animation wears, not a simplification of it.
      const rad128 = 128 * Math.PI / 180;
      const fdx = Math.sin(rad128), fdy = -Math.cos(rad128);
      const fL = Math.abs(cw * fdx) + Math.abs(ch * fdy);
      const fcx = cx + cw / 2, fcy = cy + ch / 2;
      const face = ctx.createLinearGradient(
        fcx - fdx * fL / 2, fcy - fdy * fL / 2,
        fcx + fdx * fL / 2, fcy + fdy * fL / 2);
      face.addColorStop(0,    '#e8e6e1');
      face.addColorStop(0.18, '#b9b7b2');
      face.addColorStop(0.36, '#8e8d89');
      face.addColorStop(0.52, '#d8d6d1');
      face.addColorStop(0.60, '#f2f0eb');
      face.addColorStop(0.76, '#a7a5a1');
      face.addColorStop(0.92, '#6f6e6b');
      face.addColorStop(1,    '#555452');
      ctx.fillStyle = face; ctx.fill();
      ctx.restore();

      ctx.save();
      roundRect(ctx, cx, cy, cw, ch, 22 * S); ctx.clip();
      const seam = ctx.createLinearGradient(cx + cw * 0.15, cy, cx + cw * 0.75, cy + ch);
      seam.addColorStop(0,   'rgba(255,255,255,0)');
      seam.addColorStop(0.45,'rgba(255,255,255,.34)');
      seam.addColorStop(0.6, 'rgba(255,255,255,.10)');
      seam.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = seam; ctx.fillRect(cx, cy, cw, ch);

      // Grain — the same tooth as the live card.
      const gt = document.createElement('canvas');
      gt.width = gt.height = 128;
      const gc = gt.getContext('2d');
      const gd = gc.createImageData(128, 128);
      for (let i2 = 0; i2 < gd.data.length; i2 += 4) {
        const v = 128 + (Math.random() - 0.5) * 255;
        gd.data[i2] = gd.data[i2+1] = gd.data[i2+2] = v; gd.data[i2+3] = 255;
      }
      gc.putImageData(gd, 0, 0);
      ctx.save();
      ctx.globalAlpha = 0.05; ctx.globalCompositeOperation = 'overlay';
      ctx.fillStyle = ctx.createPattern(gt, 'repeat');
      ctx.fillRect(cx, cy, cw, ch);
      ctx.restore();

      // The milled rim.
      const rim = ctx.createLinearGradient(cx, cy, cx + cw * 0.4, cy + ch);
      rim.addColorStop(0, 'rgba(255,255,255,.95)');
      rim.addColorStop(0.5, 'rgba(255,255,255,.25)');
      rim.addColorStop(1, 'rgba(42,41,38,.8)');
      roundRect(ctx, cx + 2, cy + 2, cw - 4, ch - 4, 22 * S - 2);
      ctx.strokeStyle = rim; ctx.lineWidth = 4; ctx.stroke();
      ctx.restore();
      roundRect(ctx, cx, cy, cw, ch, 22 * S);
      ctx.strokeStyle = 'rgba(70,68,64,.9)'; ctx.lineWidth = 2; ctx.stroke();

      // Card contents — the live card's own padding and scale (6.2%).
      const pad = cw * 0.062;
      if (logo.complete && logo.naturalWidth) {
        const lh = cw * 0.085, lw = lh * (logo.naturalWidth / logo.naturalHeight);
        // Stepped downscale: one 7× jump smears the ink; halve toward the
        // target and make the final placement a short hop — crisp mark.
        let src = logo, sw = logo.naturalWidth, sh = logo.naturalHeight;
        while (sh / 2 > lh) {
          const c2 = document.createElement('canvas');
          c2.width = Math.max(1, Math.round(sw / 2));
          c2.height = Math.max(1, Math.round(sh / 2));
          const c2x = c2.getContext('2d');
          c2x.imageSmoothingEnabled = true;
          c2x.drawImage(src, 0, 0, c2.width, c2.height);
          src = c2; sw = c2.width; sh = c2.height;
        }
        ctx.save();
        ctx.globalAlpha = 0.78;   // the engraving's ink, not printer black
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(src, cx + pad, cy + pad, lw, lh);
        ctx.restore();
      }
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,.4)'; ctx.shadowOffsetY = 1; ctx.shadowBlur = 0;
      // Identical engraving to the NO. in the opposite corner: same size,
      // same weight, same ink.
      ctx.fillStyle = '#45433e';
      ctx.font = '600 ' + Math.round(cw * 0.026) + 'px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'right';
      const dd = new Date();
      ctx.fillText((dd.toLocaleDateString('en-US', { month: 'short' }) + ' ' + dd.getFullYear())
                   .toUpperCase(), cx + cw - pad, cy + pad + cw * 0.026);
      ctx.restore();

      ctx.textAlign = 'left';
      const hs = Math.round(cw * 0.125), hy = cy + ch * 0.58;
      const cut = ctx.createLinearGradient(0, hy - hs * 0.72, 0, hy);
      cut.addColorStop(0, '#34332f'); cut.addColorStop(0.38, '#413f3b');
      cut.addColorStop(0.72, '#55534d'); cut.addColorStop(1, '#6b6862');
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,.42)';
      ctx.shadowOffsetY = Math.max(1, hs * 0.014); ctx.shadowBlur = 0;
      ctx.fillStyle = cut;
      ctx.font = '700 ' + hs + 'px -apple-system, "SF Pro Display", system-ui, sans-serif';
      ctx.fillText('@' + handle, cx + pad, hy);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,.4)'; ctx.shadowOffsetY = 1; ctx.shadowBlur = 0;
      ctx.fillStyle = '#45433e';
      ctx.font = '600 ' + Math.round(cw * 0.026) + 'px ui-monospace, Menlo, monospace';
      ctx.fillText('MEMBER', cx + pad, cy + ch - pad);
      ctx.textAlign = 'right';
      ctx.fillText(reservationNo != null ? cardNo(reservationNo) : 'Reserved',
                   cx + cw - pad, cy + ch - pad);
      ctx.restore();

      // Below the card, at the page's own distances: the handle in the
      // page's ramp, then the line, both centred.
      ctx.textAlign = 'center';
      let hs2 = Math.round(27 * S);
      const name = '@' + handle;
      const fontFor = sz => '700 ' + sz + 'px -apple-system, "SF Pro Display", system-ui, sans-serif';
      ctx.font = fontFor(hs2);
      while (ctx.measureText(name).width > W * 0.84 && hs2 > 40) {
        hs2 -= 4; ctx.font = fontFor(hs2);
      }
      const nw = ctx.measureText(name).width;
      const ny = cy + ch + (22 + 27) * S;
      const ramp = ctx.createLinearGradient(W/2 - nw/2, ny - hs2, W/2 + nw/2, ny);
      ramp.addColorStop(0,    '#ff9357');
      ramp.addColorStop(0.16, '#ffe9dc');
      ramp.addColorStop(0.34, '#f6aed3');
      ramp.addColorStop(0.56, '#5b9bd4');
      ramp.addColorStop(0.76, '#2f6ba6');
      ramp.addColorStop(1,    '#454065');
      ctx.fillStyle = ramp;
      ctx.fillText(name, W / 2, ny);

      ctx.fillStyle = '#a8a49c';
      ctx.font = '500 ' + Math.round(14 * S) + 'px -apple-system, system-ui, sans-serif';
      ctx.fillText(T ? '已為你保留。' : 'is reserved for you.', W / 2, ny + (6 + 20) * S);

      ctx.fillStyle = 'rgba(244,241,234,.45)';
      ctx.font = '600 ' + Math.round(12 * S) + 'px -apple-system, system-ui, sans-serif';
      ctx.fillText('withimoney.com', W / 2, H - 40 * S);

      return cv;
    }

    // ONE button. The native share sheet already IS the row of options —
    // Instagram, Messages, Save Image, Copy — so the page doesn't repaint
    // it. The card PNG rides along; desktop without a sheet gets the file.
    const myHandle = () => $('card-handle').textContent.replace(/^@/, '');
    // Pre-launch, the card invites people to RESERVE — the /i/ "add me"
    // page is for the app era. Point at the site and say the line.
    const shareLink = () => 'https://withimoney.com/';
    const shareText = () => ZH ? '在 iMoney 預留你的 @名字'
                               : 'Reserve @yourname on iMoney';

    $('share').onclick = async () => {
      try { await cursive.decode(); } catch {}
      const canvas = drawCard(myHandle());
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const file = new File([blob], 'imoney-' + myHandle() + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], text: shareText(), url: shareLink() }); return; } catch {}
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    if (T) {
      document.documentElement.lang = 'zh-Hant';
      document.title = T.title + ' — iMoney';
      const set = (sel, txt) => { const el = document.querySelector(sel); if (el) el.textContent = txt; };
      set('#step-in h1', T.inTitle);
      set('#step-in .sub', T.inSub);
      set('#pick-rest', T.almost);
      set('#claim', T.cont);
      $('apple').lastChild.textContent = ' ' + T.apple;
      $('google').lastChild.textContent = ' ' + T.google;
      set('#signout', T.cancel);
      set('#share', T.share);
      set('#step-done .sub', T.isYours);
      set('#have-sub', T.haveSub);
      set('#have-note', T.haveNote);
      set('#have-signout', T.haveSwitch);

    }

    // The card's turn: one clock, one element. 20°/s on the preserve-3d
    // turner; a finger or pointer on the card holds it. The 3D scene does
    // the rest — faces cull themselves, sheets make the milled side.
    (() => {
      const stack = document.getElementById('cardstack');
      const turner = document.getElementById('turncard');
      if (!stack || !turner) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let angle = 0, last = null, held = false;
      stack.addEventListener('pointerenter', () => { held = true; });
      stack.addEventListener('pointerleave', () => { held = false; });
      stack.addEventListener('touchstart', () => { held = true; }, { passive: true });
      stack.addEventListener('touchend', () => { held = false; });
      const tick = (now) => {
        if (last == null) last = now;
        if (!held) angle = (angle + (now - last) / 1000 * 20) % 360;
        last = now;
        turner.style.transform = 'rotateY(' + angle.toFixed(2) + 'deg)';
        turner.classList.toggle('showback', Math.cos(angle * Math.PI / 180) < 0);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();

    // The demo gate settles first (module scripts may await at top level),
    // so a keyed demo link never flashes the sign-in step underneath.
    await demoGate();
    // Fires on load AND after the OAuth redirect drops the session in.
    sb.auth.onAuthStateChange(() => refresh());
    refresh();
  </script>
</body>
</html>
