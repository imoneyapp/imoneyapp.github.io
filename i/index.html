<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add me on iMoney</title>
  <meta name="description" content="A friend invited you to build better money habits together on iMoney.">
  <!-- Link-preview card: the app icon, shown when the invite is shared
       in iMessage, IG DMs, LINE, etc. -->
  <meta property="og:title" content="Add me on iMoney">
  <meta property="og:description" content="Build better money habits together.">
  <meta property="og:image" content="https://withimoney.com/assets/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon-256.png?v=2">
  <link rel="apple-touch-icon" href="../assets/appicon.png">
  <link rel="stylesheet" href="../style.css?v=13">
  <style>
    .invite { text-align: center; padding-top: 8vh; }
    .invite .handle { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 18px 0 6px; }
    .invite .sub { color: var(--bone-dim); margin-bottom: 36px; }
    .invite .open {
      display: inline-block; padding: 14px 34px; border-radius: 999px;
      background: var(--bone); color: #10110F; font-weight: 700; text-decoration: none;
      font-size: 17px;
    }
    .invite .fallback { display: block; margin-top: 22px; color: var(--bone-dim); font-size: 14px; }
    .invite .fallback a { color: var(--bone); }
    .invite .mark { height: 84px; width: auto; }
    .invite .avatar {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
      display: none; margin: 26px auto 0;
      border: 1.5px solid rgba(246,244,238,0.35);
    }
  </style>
</head>
<body>
<main>
  <header class="site"><a href="/">iMoney</a><span>Invitation</span></header>
  <div class="invite">
    <img class="mark" src="../assets/logo-mark.png" alt="iMoney">
    <img class="avatar" id="avatar" alt="">
    <div class="handle" id="handle">@friend</div>
    <p class="sub" id="line">invites you to build better money habits together.</p>
    <a class="open" id="open" href="#">Open in iMoney</a>
    <span class="fallback" id="fallback">
      Don't have the app yet? <a href="/">Get iMoney</a>
    </span>
  </div>
  <script>
    (function () {
      var u = new URLSearchParams(location.search).get("u") || "";
      // Handles are app-validated; keep only safe characters anyway.
      u = u.replace(/[^A-Za-z0-9_.]/g, "").slice(0, 30);
      if (u) document.getElementById("handle").textContent = "@" + u;
      // Optional avatar: the app embeds its storage path as ?a= so the
      // page can show the inviter's face without any backend call.
      var a = new URLSearchParams(location.search).get("a") || "";
      if (a && /^[A-Za-z0-9_\/.\-]{1,120}$/.test(a)) {
        var img = document.getElementById("avatar");
        img.src = "https://cpsdkarncveeemrfmkll.supabase.co/storage/v1/object/public/avatars/" + a;
        img.onload = function () { img.style.display = "block"; };
      }
      var deep = "co.up.imoney://add?handle=" + encodeURIComponent(u);
      var open = document.getElementById("open");
      open.href = deep;
      if ((navigator.language || "").toLowerCase().indexOf("zh") === 0) {
        document.getElementById("line").textContent = "邀請你一起養成更好的記帳習慣。";
        open.textContent = "在 iMoney 中開啟";
        document.getElementById("fallback").innerHTML =
          '還沒有 App 嗎？<a href="/">下載 iMoney</a>';
      }
    })();
  </script>
  <footer>© 2026 iMoney · <a href="../about/">About</a> · <a href="../privacy/">Privacy</a> · <a href="../terms/">Terms</a> · <a href="../support/">Support</a></footer>
</main>
</body>
</html>
