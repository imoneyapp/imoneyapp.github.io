<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開放預留 @使用者名稱 — iMoney</title>
  <meta name="description" content="iMoney——極簡、社群的記帳 App。手動記帳、和朋友分帳、不連接銀行。上線前先預約你的 @帳號。">
  <meta property="og:title" content="在 iMoney 開放預留 @使用者名稱">
  <meta property="og:description" content="花錢，是一門認識自己的藝術。">

  <style>
    /* ---- The planet hero. One page again: the CTA scrolls to #reserve,
       and when a clean loop video exists it can sit here scroll-scrubbed —
       the structure is ready for it. ---- */
    html { scroll-behavior: smooth; }
    /* The sky lives on the BODY, its darkening baked into the image — so
       URL-bar collapse, overscroll, anything past the footer is still the
       same night. There is no "after the page". */
    html { background: #0b0b0c; }
    .claim-screen { position: relative; width: 100%; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* One column, vertically centred between a pinned header and a pinned
       footer. An earlier version stacked fixed margins and sized the hero
       with `calc(100svh - 470px)`; on a short window that sum overflowed,
       the page scrolled, and the card got sliced off the top. Nothing here
       is a subtraction — the hero takes a share of the height and the
       flexbox does the arithmetic. */
    body {
      margin: 0; min-height: 100svh; background: var(--ink); color: var(--bone);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
    }
    .wrap { width: 100%; max-width: 860px; min-height: 100svh; margin: 0 auto;
            padding-left: 24px; padding-right: 24px;
            display: flex; flex-direction: column;
            /* Named because the centring below has to do arithmetic on it. */
            --card-h: min(42vh, 470px, calc(92vw / 1.586)); }
    /* Same spot as the policy/support pages: the SCREEN's corner, not the
       column's edge — the brand belongs to the page, not the layout. */
    header { position: absolute; top: 26px; left: clamp(24px, 3vw, 40px); }
    #brand { display: flex; align-items: center; gap: 9px; color: inherit;
             text-decoration: none; transition: opacity .3s; }
    #brand:hover { opacity: .62; }
    #brand img { height: 34px; }
    /* The app's wordmark is SF Rounded (Typography.display). ui-rounded is
       how the web asks the system for that face — Safari resolves it, other
       browsers fall back to the plain system sans. */
    #brand b { font-size: 20px; font-weight: 600; letter-spacing: -.2px;
               font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif; }
    /* The hero owns the leftover height and centres in it. gap replaces the
       margins that used to stack up. */
    main { flex: 1 1 auto; min-height: 0; overflow: visible;
           display: flex; flex-direction: column; align-items: center;
           /* The card's midline IS the screen's midline: the stack starts
              at half the viewport minus half the card. Short windows push
              the form below the fold, which free scroll reaches. */
           justify-content: flex-start;
           padding: calc(50svh - var(--card-h) / 2) 0 clamp(20px, 3vh, 44px);
           gap: clamp(24px, 3.8vh, 46px); }


    /* Sized by HEIGHT with width following from the aspect ratio, so the
       card is the first thing to give ground when the column is tight — it
       gets smaller rather than the page getting longer. 1.586 is a real
       card. */
    /* The width cap has to be expressed as a height too, or the box stays
       at its vh height while the card inside it is only 92vw/1.586 — dead
       space under the card on a phone that reads as a spacing mistake. */
    /* Phones: the stack is tightened until card → field fits in what a
       keyboard leaves (~430px), so typing shows the whole ritual — card,
       headline, field — with nothing hidden and nothing to scroll. */
    @media (max-width: 640px) {
      main { justify-content: center; padding-top: 14px; padding-bottom: 16px; gap: 22px;
             /* Air, not size: the card cedes a little width and height so
                the stack stops touching itself. */
             --card-h: min(38vh, calc(87vw / 1.586)); }
      .scene { margin: 14px 0; }
      /* Premium type whispers: the phone page steps everything down a
         size and lets the card carry the weight. */
      .say h1 { font-size: 22px; letter-spacing: -.6px; }
      .slogan .not { color: var(--bone); font-weight: 700; }
    .slogan { margin-top: 5px; font-size: 12.5px; }
      .field span, input { font-size: 15px; }
      input { padding: 15px 0; }
      button { font-size: 13px; padding: 15px 16px; }
      .status { font-size: 12px; }
      footer { font-size: 12px; }
    }
    .scene { height: var(--card-h);
             aspect-ratio: 1.586; width: auto;
             /* rigid: the centring math assumes the card's real height, and
                a shrinkable card was quietly eating 100px of it */
             flex: 0 0 auto;
             /* A floor, because past this the card's own contents stop
                fitting inside it and the handle disappears entirely — a
                card too small to carry a name isn't worth showing. */
             min-height: 150px; }

    /* The planet's body, back by request: lit edge, then the teal upper
       bands falling through orchid into the rose of the lower limb. */
    h1 { font-size: clamp(24px, 2.8vw, 34px); font-weight: 700; letter-spacing: -.9px;
         background: linear-gradient(104deg,
           #eefafa 0%, #9fd2d6 26%, #71aeb3 46%,
           #b190ab 68%, #d09ab4 86%, #cf989d 100%);
         -webkit-background-clip: text; background-clip: text;
         -webkit-text-fill-color: transparent; color: #f4f1ea;
         margin: 0; }
    .say h1 { margin: 0; }
    .slogan { color: var(--bone-dim); font-size: clamp(13px, 1.3vw, 15px);
              margin: 10px 0 0; }

    .row { display: flex; gap: 9px; max-width: 330px; width: 100%; margin: 0 auto; }
    /* A lit well rather than a dark box. The old field was the same value as
       the page, so it read as decoration — this one is glass over ink, with
       a brighter rim, so it's obvious it's the thing you fill in. */
    .field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px;
             background: rgba(244,241,234,.055);
             border: 1px solid rgba(244,241,234,.20); border-radius: 17px; padding: 0 20px;
             box-shadow: inset 0 1px 0 rgba(244,241,234,.06);
             transition: border-color .2s, background .2s; }
    .field:hover { background: rgba(244,241,234,.075); }
    /* Focus wears the same planet ramp as the headline — a gradient can't
       sit on border-color, so the ring is a border-box gradient painted
       under an opaque padding-box (ink + the same glass tint as before). */
    .field:focus-within {
      border-color: transparent;
      background:
        linear-gradient(rgba(244,241,234,.09), rgba(244,241,234,.09)) padding-box,
        linear-gradient(#0b0b0c, #0b0b0c) padding-box,
        linear-gradient(104deg, #9fd2d6 0%, #71aeb3 38%, #b190ab 68%, #d09ab4 100%) border-box;
    }
    .field span { color: var(--bone-dim); font-size: clamp(16px, 4.2vw, 19px); font-weight: 600; flex: 0 0 auto; }
    input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--bone);
            font-weight: 600; font-size: clamp(16px, 4.2vw, 19px); line-height: 1; font-family: inherit; padding: 17px 0; letter-spacing: -.2px; }
    /* The placeholder is the instruction — dim to the point of invisible
       was the reason the field didn't read as a field. */
    input::placeholder { color: var(--bone-faint); opacity: 1; }
    button { background: var(--bone); color: var(--ink); border: 0; border-radius: 17px;
             padding: 17px 18px; flex: 0 0 auto; font-weight: 600; font-size: 15px;
             line-height: 1; font-family: inherit; cursor: pointer;
             white-space: nowrap; letter-spacing: -.1px; }
    button:disabled { opacity: .4; cursor: default; }

    /* Very short window — a laptop with the browser half-height. The card
       has already shrunk to its floor by here, so the words give way next
       rather than letting the column spill over the footer. */
    @media (max-height: 620px) {
      h1 { font-size: clamp(24px, 4vw, 36px); }
      .slogan { font-size: 15px; margin-top: 6px; }
      .status { display: none; }
    }

    .status { font-size: 14px; color: var(--bone-faint); min-height: 20px; margin: 0; }
    .status.bad { color: var(--negative); }
    .status.good { color: var(--positive); }

    /* The status line lands right under the button, so the footer needs
       real air above it or the two read as one block. Padding rather than a
       margin on .status, so the gap is there whether or not the status has
       anything to say. */

    /* The legal line leaves the nav row alone: it breaks out of the
       centered column to the full viewport and parks at the page's
       bottom-left, the way Apple's does. */
    .copyline { width: 100vw; margin-left: calc(50% - 50vw);
                box-sizing: border-box; padding: 0 24px;
                text-align: left; margin-top: 22px;
                font-size: 11px; color: var(--bone-faint); }
    footer { width: 100%; text-align: center; }
    footer { flex: 0 0 auto; padding: clamp(30px, 6vh, 78px) 0 30px;
             font-size: 13px; color: var(--bone-faint); }
    footer a { color: var(--bone-faint); text-decoration: none; }
    footer a:hover { color: var(--bone-dim); }
    footer .sep { opacity: .4; margin: 0 8px; }
  </style>

</head>
<body>
  <section class="claim-screen" id="reserve">
  <div class="wrap">
    <header>
      <a id="brand" href="/">
        <img src="/assets/logo-mark.png" alt="">
        <b>iMoney</b>
      </a>
    </header>
  
    <main>
      <!-- The card is the whole page. It carries the mark, and the handle
           appears on it live as you type — you watch your name land on the
           object before you commit to anything. -->
      <div class="scene">
        <div class="float">
          <div class="card">
            <div class="face front">
              <div class="card-inner">
                <div class="card-top">
                  <img class="card-logo" src="/assets/logo-ink-star.png" alt="iMoney">
                  <div class="card-meta engraved">Aug. 2026</div>
                </div>
                <div class="card-handle placeholder engraved" id="card-handle">@使用者名稱</div>
                <div class="card-foot">
                  <div class="quote engraved">極簡。私密。金錢習慣。</div>
                  <div class="card-meta plate engraved">開放<br class="plate-br">預留</div>
                </div>
              </div>
            </div>
            <div class="face back"><img src="/assets/logo-ink-star.png" alt=""></div>
          </div>
        </div>
      </div>

      <div class="say">
        <h1 id="headline">開放預留。</h1>
        <p class="slogan">一個<span class="not">不</span>會去讀你銀行帳戶的記帳 App。</p>
      </div>

      <form class="row" id="form">
        <label class="field">
          <span>@</span>
          <input id="handle" placeholder="yourname" autocapitalize="none" autocorrect="off"
                 spellcheck="false" maxlength="20" aria-label="你的帳號代號">
        </label>
        <button id="go" type="submit" disabled>預留</button>
      </form>
      <p class="status" id="status"></p>
    </main>

    <footer>
      <a href="/privacy/zh/">隱私權政策</a><span class="sep">·</span>
      <a href="/support/zh/">支援</a><span class="sep">·</span>
      <a href="mailto:upappco@gmail.com">聯絡我們</a><span class="sep">·</span>
      <a href="/business/zh/">企業合作</a>
      <div class="copyline">Copyright © 2026 iMoney. 保留一切權利。</div>
    </footer>
  </div>
  </section>

  <script>
    const SB = 'https://cpsdkarncveeemrfmkll.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwc2RrYXJuY3ZlZWVtcmZta2xsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzQ3NzAsImV4cCI6MjA5NjE1MDc3MH0.zzHVArTaz2OdW1pYEzMIlrgcyuXWm4MNnR-bizyRhdY';

    const input = document.getElementById('handle');
    const card  = document.getElementById('card-handle');
    const go    = document.getElementById('go');
    const status = document.getElementById('status');
    const DEFAULT = '';

    const clean = v => v.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '');

    input.addEventListener('input', () => {
      const h = clean(input.value);
      if (h !== input.value.trim().toLowerCase().replace(/^@/, '')) input.value = h;
      const shown = '@' + (h || '使用者名稱');
      card.textContent = shown;
      card.classList.toggle('placeholder', !h);
      go.disabled = h.length < 2;
      status.className = 'status';
      if (!h.length)         { status.textContent = DEFAULT; }
      else if (h.length < 2) { status.textContent = '至少 2 個字元。'; }
      else                   { check(h); }
    });

    let checkTimer, checking = '';
    function check(h) {
      clearTimeout(checkTimer);
      status.textContent = '檢查中…';
      checkTimer = setTimeout(async () => {
        checking = h;
        try {
          const res = await fetch(SB + '/rest/v1/rpc/is_handle_taken', {
            method: 'POST',
            headers: { apikey: KEY, Authorization: 'Bearer ' + KEY,
                       'Content-Type': 'application/json' },
            body: JSON.stringify({ target_handle: h })
          });
          const taken = await res.json();
          if (checking !== h || clean(input.value) !== h) return;   // stale
          status.className = 'status' + (taken ? ' bad' : ' good');
          status.textContent = (taken ? '@%s 已經有主人了，換一個。' : '@%s 可以是你的。').replace('%s', h);
          go.disabled = !!taken;
        } catch {
          // Never claim "taken" on a network blip — let them try to reserve
          // and be told by the server, which can't be wrong about it.
          if (checking !== h) return;
          status.className = 'status';
          status.textContent = DEFAULT;
          go.disabled = false;
        }
      }, 350);
    }

    // Auth lives on /reserve — one place, one set of redirect URLs. The
    // handle rides along so nobody has to type it twice.
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const h = clean(input.value);
      if (h.length < 2 || go.disabled) return;
      location.href = '/reserve/?lang=zh&h=' + encodeURIComponent(h);
    });
  </script>
  <script>
    (() => {
      // The ghost types itself. An empty field says "type something"; a
      // field quietly writing @ev, @kai, @yuki says "type a NAME" — and
      // it's the one thing on a still page that rewards watching.
      const input = document.getElementById('handle');
      const NAMES = ['ev', 'kai', 'imoney', 'ineedyou', 'yourname'];
      let n = 0, i = 0, erasing = false;
      (function tick() {
        if (input.value) { input.placeholder = 'yourname'; return setTimeout(tick, 1200); }
        const word = NAMES[n];
        i += erasing ? -1 : 1;
        input.placeholder = word.slice(0, i) + (i < word.length ? '\u2009' : '');
        let wait = erasing ? 45 : 95;
        if (!erasing && i === word.length) { erasing = true; wait = 1500; }
        else if (erasing && i === 0)       { erasing = false; n = (n + 1) % NAMES.length; wait = 260; }
        setTimeout(tick, wait);
      })();
    })();
  </script>
  <script>
    // The cloudflare.pay lean: the corner under the pointer dips a few
    // degrees, the far corner rises, flat again on leave.
    (() => {
      const scene = document.querySelector('.scene');
      const card = document.querySelector('.card');
      if (!scene || !card || !matchMedia('(hover: hover)').matches) return;
      scene.addEventListener('pointermove', e => {
        const r = scene.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        card.style.setProperty('--ry', (x * 22).toFixed(2) + 'deg');
        card.style.setProperty('--rx', (-y * 16).toFixed(2) + 'deg');
      });
      scene.addEventListener('pointerenter', () => card.style.setProperty('--s', '1.025'));
      scene.addEventListener('pointerleave', () => {
        card.style.removeProperty('--rx');
        card.style.removeProperty('--ry');
        card.style.removeProperty('--s');
      });
    })();
  </script>
  <script>
    // iOS scrolls the focused field into view by scrolling the CARD out of
    // view. The compact layout already fits above the keyboard, so pin the
    // page back to the top once the keyboard has landed.
    (() => {
      const inp = document.getElementById('handle');
      if (!inp || !matchMedia('(max-width: 640px)').matches) return;
      inp.addEventListener('focus', () => {
        setTimeout(() => document.getElementById('reserve').scrollIntoView({ behavior: 'smooth' }), 60);
      });
    })();
  </script>
  <script>
    // The press. iOS won't run :active on a non-interactive element, so
    // the squeeze is scripted: finger down squeezes, up or cancel lets go.
    (() => {
      const card = document.querySelector('.card');
      if (!card || matchMedia('(hover: hover)').matches) return;
      const off = () => card.classList.remove('pressed');
      card.addEventListener('touchstart', () => card.classList.add('pressed'), { passive: true });
      card.addEventListener('touchend', off);
      card.addEventListener('touchcancel', off);
    })();
  </script>
</body>
