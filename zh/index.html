<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iMoney</title>
  <meta name="description" content="iMoney——極簡、社群的記帳 App。手動記帳、和朋友分帳、不連接銀行。上線前先預約你的 @帳號。">
  <meta property="og:title" content="iMoney">
  <meta property="og:description" content="iMoney——極簡、社群的記帳 App。手動記帳、和朋友分帳、不連接銀行。上線前先預約你的 @帳號。">
  <meta property="og:image" content="https://withimoney.com/assets/appicon.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png?v=2">
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon-256.png?v=2">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"MobileApplication","name":"iMoney",
   "alternateName":["iMoney 記帳","iMoney Money Tracker"],
   "operatingSystem":"iOS","applicationCategory":"FinanceApplication",
   "url":"https://withimoney.com","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},
   "description":"極簡、社群的 iOS 記帳 App。手動記帳、和朋友分帳、預算與月報表——不連接銀行帳戶、沒有廣告。"}
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    :root { --bone: #f4f1ea; --bone-dim: #a8a49c; }
    body { background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", system-ui, sans-serif; }
    .cosmos {
      position: relative; width: 100%; height: 100svh;
      background: #000 url(/assets/planet.jpg) right center / cover no-repeat;
    }
    .cosmos-inner {
      position: absolute; top: 50%; left: clamp(24px, 12vw, 220px);
      transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 34px;
    }
    /* Still, translucent, flickering like a sign warming up — irregular,
       mostly lit, never fully out. It hangs; it doesn't drift. */
    .cosmos-mark { width: clamp(56px, 7vw, 92px); opacity: .55;
                   animation: cosmos-flicker 6.5s linear infinite; }
    @keyframes cosmos-flicker {
      0%, 100%    { opacity: .55; }
      7%           { opacity: .22; }
      9%           { opacity: .58; }
      13%          { opacity: .38; }
      15%, 52%    { opacity: .55; }
      54%          { opacity: .18; }
      56%          { opacity: .5; }
      71%          { opacity: .34; }
      74%          { opacity: .55; }
    }
    .cosmos-cta {
      color: var(--bone); text-decoration: none;
      font-size: clamp(17px, 2vw, 21px); font-weight: 600; letter-spacing: -.2px;
      opacity: .85; transition: opacity .25s;
    }
    .cosmos-cta:hover { opacity: 1; }
    @media (max-width: 700px) {
      /* The portrait crop, made for this: cover from the centre so the
         photo owns every pixel — no borders, no bars. The mark and the
         line sit dead centre of the screen. */
      .cosmos { background-image: url(/assets/planet-vertical.jpg);
                background-position: center; }
      .cosmos-inner { left: 50%; transform: translate(-50%, -50%); }
    }
    @media (prefers-reduced-motion: reduce) { .cosmos-mark { animation: none; } }
  </style>
</head>
<body>
  <section class="cosmos" aria-label="iMoney">
    <div class="cosmos-inner">
      <img class="cosmos-mark" src="/assets/logo-mark.png" alt="">
      <a class="cosmos-cta" href="/zh/claim/">預約 @yourname</a>
    </div>
  </section>
</body>
</html>
