  <h1>刪除帳號</h1>

  <p>在 App 內：<strong>設定 → 刪除帳號</strong>。個人檔案、紀錄、收據、
  好友與分帳都會刪除。加密備份 30 天內清除。你參與過的分帳會留在對方的
  紀錄裡，但不會有你的名字。</p>

  <p>登不進去？用帳號上的電子郵件地址寄信到
  <strong>upappco@gmail.com</strong>。</p>

  <p>只想刪掉一部分，左滑紀錄即可刪除，或在編輯個人檔案移除照片。</p>

  <p class="fine">請先在 App Store 或 Google Play 取消 PRØ——刪除帳號不會停止扣款。</p>
